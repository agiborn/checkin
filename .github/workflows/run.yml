name: run

on:
  workflow_dispatch:
  schedule:
    - cron: 10 16 * * *

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA || 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/156.0.0.0 Safari/537.36' }}
          DOMAIN: ${{ secrets.DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
          AUTO_EXCHANGE: 'false'
